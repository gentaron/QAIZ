<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QAIZ — 地域×セクター株式分析ターミナル</title>
<style>
:root{
  --bg:#0a0d12; --panel:#111721; --panel2:#0e131c; --line:#1e2735;
  --text:#d7dee9; --muted:#7b8798; --dim:#5c6779;
  --accent:#4cc9f0; --accent2:#b892ff;
  --pos:#16c784; --neg:#ea3943; --warn:#f0b429;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5}
/* 横スクロールは各コンテナの中だけで起こす。body 自体が横に動くと
   「戻れない画面」になってスマホでの操作が破綻する */
body{overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .warn{color:var(--warn)}
.small{font-size:11px}
button,select,input{font-family:inherit;font-size:12px}

header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0d121a,#0a0d12);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px;color:#fff}
.brand span{color:var(--accent)}
.tagline{color:var(--muted);font-size:11px;border-left:1px solid var(--line);padding-left:12px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;background:var(--panel2);white-space:nowrap}
.chip b{font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
button.act{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer}
button.act:hover{border-color:var(--accent);color:var(--accent)}
button.act:disabled{opacity:.5;cursor:default}

nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:9px 14px;cursor:pointer;white-space:nowrap;font-size:12.5px}
nav button:hover{color:var(--text)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}

main{padding:14px 16px 60px;max-width:1900px;margin:0 auto}
.grid{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.panel>h3{margin:0;padding:9px 12px;font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h3 .hint{font-weight:400;letter-spacing:0;font-size:10.5px;color:var(--dim)}
/* パネル見出しに置く切り替えセレクト */
.hsel{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:3px 6px}
.pad{padding:12px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--panel2);text-align:right;padding:6px 8px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;font-size:11px}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
th:hover{color:var(--accent)}
th.sorted{color:var(--accent)}
td{padding:5px 8px;text-align:right;border-bottom:1px solid #161d28;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.l{font-family:var(--sans)}
tbody tr:hover{background:#161d28}
tbody tr.click{cursor:pointer}
.scroll{overflow:auto;max-height:74vh}
.scroll-x{overflow-x:auto}

.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;border:1px solid var(--line);color:var(--muted)}
.tag.b{background:rgba(22,199,132,.13);border-color:rgba(22,199,132,.35);color:var(--pos)}
.tag.s{background:rgba(234,57,67,.13);border-color:rgba(234,57,67,.35);color:var(--neg)}
.tag.c{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.35);color:var(--warn)}

.heatgrid{display:grid;grid-template-columns:auto 1fr;gap:3px;padding:12px;overflow-x:auto}
.hcell{border-radius:5px;padding:7px 8px;min-width:118px;cursor:pointer;border:1px solid transparent;transition:transform .08s}
.hcell:hover{border-color:#fff3;transform:translateY(-1px)}
.hcell .n{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcell .v{font-size:15px;font-weight:700;font-family:var(--mono)}
.hcell .s{font-size:10px;opacity:.8;font-family:var(--mono)}
.hrow-label{font-size:11px;color:var(--muted);padding:7px 4px;align-self:center;white-space:nowrap}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;text-align:right;font-family:var(--mono)}

.bar{height:5px;background:#1b2432;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px}

.sig{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:6px;background:var(--panel2);border-radius:0 5px 5px 0}
.sig.bull{border-left-color:var(--pos)}
.sig.bear{border-left-color:var(--neg)}
.sig.caut{border-left-color:var(--warn)}
.sig .t{font-weight:600;font-size:12px}
.sig .d{color:var(--muted);font-size:11.5px;margin-top:2px}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters select,.filters input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:4px 7px}
.filters input[type=number]{width:82px}
.frow{display:flex;gap:5px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.frow button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 3px}
.frow button:hover{color:var(--neg)}
.fgroup{display:flex;align-items:center;gap:6px}
.fbtns{display:flex;gap:6px;flex-wrap:wrap}

.preset{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:8px 10px;cursor:pointer;text-align:left}
.preset:hover{border-color:var(--accent)}
.preset.on{border-color:var(--accent);background:rgba(76,201,240,.08)}
.preset b{display:block;font-size:12px;margin-bottom:2px}
.preset span{color:var(--muted);font-size:10.5px;line-height:1.4;display:block}

.loading{padding:40px;text-align:center;color:var(--muted)}
.err{padding:12px;color:var(--neg);font-size:12px}
.note{color:var(--dim);font-size:10.5px;padding:8px 12px;border-top:1px solid var(--line);line-height:1.6}

.idea{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px;margin-bottom:10px}
.idea-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.idea-h .nm{font-size:15px;font-weight:700}
.idea-h .sym{font-family:var(--mono);color:var(--muted);font-size:12px}
.idea-lead{font-size:12.5px;margin-bottom:8px}
.idea-plain{background:rgba(76,201,240,.07);border-left:3px solid var(--accent);border-radius:0 5px 5px 0;padding:7px 10px;font-size:12px;margin-bottom:9px;line-height:1.65}
.idea-plain b{color:var(--accent);font-weight:600}
.idea-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.idea-box>div.hd{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;letter-spacing:.04em}
.idea-box ul{margin:0;padding-left:16px}
.idea-box li{font-size:12px;margin-bottom:4px;line-height:1.6}
.idea-box.risk li{color:#e9b8bb}
.idea-ev{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.idea-ev .cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;min-width:88px}
.idea-ev .cell .l{font-size:10px;color:var(--muted)}
.idea-ev .cell .v{font-family:var(--mono);font-size:14px;font-weight:600}
.conv{display:inline-flex;gap:2px}
.conv i{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block}
.conv i.on{background:var(--accent)}
.rel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.relchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.relchip:hover{border-color:var(--accent);color:var(--accent)}
.relchip .k{color:var(--dim);font-size:10px;margin-right:4px}
.gl{border-bottom:1px dotted var(--muted);cursor:help}
.gl:hover{color:var(--accent);border-bottom-color:var(--accent)}
#glosspop{position:fixed;z-index:200;max-width:340px;background:var(--panel);border:1px solid var(--accent);border-radius:9px;padding:11px 13px;box-shadow:0 10px 32px rgba(0,0,0,.6);display:none;font-size:12px;line-height:1.7}
#glosspop.on{display:block}
#glosspop h4{margin:0 0 5px;font-size:13px;color:var(--accent)}
#glosspop dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px}
#glosspop dt{color:var(--muted);white-space:nowrap;font-size:11px}
#glosspop dd{margin:0;font-size:11.5px}
#glosspop .trap{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);color:var(--warn);font-size:11.5px}
.newsitem{padding:6px 12px;border-bottom:1px solid #161d28;font-size:12px}
.newsitem .src{color:var(--dim);font-size:10.5px}

#modal{position:fixed;inset:0;background:rgba(4,6,10,.82);display:none;z-index:100;overflow:auto;padding:24px;-webkit-overflow-scrolling:touch}
#modal.on{display:block}
.sheet{max-width:1280px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.sheet-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;border-radius:12px 12px 0 0;flex-wrap:wrap}
.sheet-h h2{margin:0;font-size:17px}
.close{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:28px;height:28px;cursor:pointer}
.close:hover{color:var(--neg);border-color:var(--neg)}

/* ------------------------------------------------------------------ *
 * レイアウトの列定義
 *
 * 列数はインラインスタイルではなくクラスで持つ。インラインだと
 * メディアクエリで上書きできず、!important を撒く羽目になる。
 * ------------------------------------------------------------------ */
.grid.cols-3{grid-template-columns:minmax(300px,1fr) minmax(300px,1fr) minmax(280px,.85fr)}
.grid.cols-main-side{grid-template-columns:1.5fr 1fr}
.grid.cols-main-side-narrow{grid-template-columns:1.1fr .9fr}
.grid.cols-main-fixed{grid-template-columns:1fr 340px}
.grid.cols-cards{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.cols-presets{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* SVG は viewBox で縮むが、幅 390px の画面に 1180 幅のチャートを
   押し込むと軸ラベルが 5px 相当になって読めない。一定幅を保って
   横スクロールさせるほうが、潰して見せるより実用的 */
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartwrap>svg{display:block}

/* ------------------------------------------------------------------ *
 * レスポンシブ
 * ------------------------------------------------------------------ */

@media (max-width:1150px){
  .grid.cols-3{grid-template-columns:1fr 1fr}
  .grid.cols-main-fixed{grid-template-columns:1fr}
}

@media (max-width:860px){
  .grid.cols-3,
  .grid.cols-main-side,
  .grid.cols-main-side-narrow{grid-template-columns:1fr}
  main{padding:12px 12px 60px}
}

/* ---- スマートフォン ---- */
@media (max-width:640px){
  body{font-size:13.5px}

  /* ノッチ端末の左右セーフエリアを確保する */
  .hbar{padding:8px max(10px,env(safe-area-inset-left)) 8px max(10px,env(safe-area-inset-right));gap:8px}
  main{padding:10px max(8px,env(safe-area-inset-left)) 72px max(8px,env(safe-area-inset-right))}

  .brand{font-size:14px}
  .tagline{display:none}
  #stamp{width:100%;order:9}
  nav{padding:0 4px}
  nav button{padding:11px 12px;font-size:13px}

  .panel{border-radius:7px}
  .panel>h3{padding:9px 10px;font-size:11.5px}
  .panel>h3 .hint{display:none}
  .pad{padding:10px}
  .note{padding:8px 10px}

  /* 入力系は 16px 未満だと iOS Safari がフォーカス時に自動ズームする。
     ズームすると画面幅が変わって表がずれるので、必ず 16px 以上にする */
  input,select,textarea{font-size:16px}
  /* 見出し内セレクトは指で押せる高さを確保する (既定の 27px では小さすぎる) */
  .hsel{min-height:40px;padding:8px 10px;margin-left:0;width:100%}
  .panel>h3{flex-wrap:wrap;gap:6px}
  button.act{min-height:40px;padding:8px 14px;font-size:13px}
  .filters{padding:10px;gap:10px;flex-direction:column;align-items:stretch}
  .fgroup{flex-direction:column;align-items:stretch;gap:3px}
  /* multiple select は size=1 のままだと 1 行分の高さに潰れ、
     選択済みの項目すら読めなくなる。候補が 3 件見える高さを与える */
  .filters select[multiple]{height:104px}
  .fbtns{width:100%}
  .fbtns button{flex:1 1 0;min-width:96px}
  .filters select,.filters input{padding:7px 8px}
  .filters input[type=number]{width:92px}
  .frow{flex-wrap:wrap;width:100%}
  .frow select{flex:1 1 auto;min-width:0}
  .frow button[data-role=del]{min-width:32px;min-height:32px}

  /* 表: 縦は画面ごとスクロールさせる。入れ子のスクロール領域は
     指が表の上にあるとページが動かせなくなり、スマホで最悪の体験になる */
  .scroll{max-height:none;overflow-x:auto;overflow-y:visible}
  th{position:static}
  td,th{padding:7px 8px}
  table{font-size:12px}
  /* 横スクロール中も銘柄名を見失わないよう先頭列を固定する */
  td:first-child,th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}

  .heatgrid{grid-template-columns:1fr;padding:10px;gap:6px}
  .hrow-label{padding:2px 0;font-weight:600;color:var(--text);border-bottom:1px solid var(--line)}
  .hcell{min-width:0;flex:1 1 calc(50% - 3px)}

  .kv{font-size:12.5px}

  /* モーダルは全面表示にする。余白を残すと本文の幅が足りない */
  #modal{padding:0}
  .sheet{border:none;border-radius:0;min-height:100%}
  .sheet-h{border-radius:0;padding:10px max(10px,env(safe-area-inset-left));gap:8px}
  .sheet-h h2{font-size:16px;width:100%}
  .sheet-h .close{position:absolute;top:8px;right:10px;width:36px;height:36px}
  .sheet-h>.spacer{display:none}
  .sheet>div{padding:10px !important}

  .idea-cols{grid-template-columns:1fr}
  .idea{padding:10px}
  #glosspop{left:8px !important;right:8px;max-width:none;width:auto}
  .chartwrap>svg{min-width:600px}
  .rrgwrap{overflow-x:auto}
  .rrgwrap>svg{min-width:560px}
}

/* ---- 小型スマートフォン ---- */
@media (max-width:380px){
  .hcell{flex:1 1 100%}
  .brand{font-size:13px}
  nav button{padding:10px 9px;font-size:12.5px}
}

/* ---- 指で操作している端末 ---- */
@media (hover:none){
  /* ホバー前提の表現をタップ環境で残すと「押したのに何も起きない」に見える */
  tbody tr:hover{background:transparent}
  tbody tr.click:active{background:#1b2432}
  .hcell:hover{transform:none}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">QA<span>I</span>Z</div>
    <div class="tagline">地域 × セクター 株式分析ターミナル</div>
    <div id="regimechips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="spacer"></div>
    <div id="stamp" class="small muted"></div>
    <button class="act" id="refresh">更新</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"><div class="loading">読み込み中…</div></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="glosspop"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * QAIZ ダッシュボード
 * ビルド不要の素の JS。Worker の /api/* を叩いて描画するだけ。
 * 数値は「取れなかった = null」を必ず "—" として出す。0 と混ぜない。
 * ------------------------------------------------------------------ */

const S = { overview:null, universe:null, presets:null, tab:"overview", cache:{} };

/* ---------- フォーマッタ ---------- */
const isN = (x) => typeof x === "number" && isFinite(x);
const DASH = '<span class="muted">—</span>';

function pct(x, d = 2) {
  if (!isN(x)) return DASH;
  const v = (x * 100).toFixed(d);
  const cls = x > 0 ? "pos" : x < 0 ? "neg" : "muted";
  return `<span class="${cls}">${x > 0 ? "+" : ""}${v}%</span>`;
}
function pctPlain(x, d = 1) { return isN(x) ? `${(x * 100).toFixed(d)}%` : "—"; }
function num(x, d = 2) { return isN(x) ? x.toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d }) : DASH; }
function mult(x, d = 1) { return isN(x) ? `${x.toFixed(d)}<span class="muted small">倍</span>` : DASH; }
function score(x) {
  if (!isN(x)) return DASH;
  const c = x >= 70 ? "pos" : x <= 30 ? "neg" : "";
  return `<span class="${c}">${x.toFixed(0)}</span>`;
}
function bigNum(x) {
  if (!isN(x)) return DASH;
  const a = Math.abs(x);
  if (a >= 1e12) return (x / 1e12).toFixed(2) + "T";
  if (a >= 1e9) return (x / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return (x / 1e6).toFixed(1) + "M";
  return x.toLocaleString("ja-JP");
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function when(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(0, 16);
  return d.toLocaleString("ja-JP", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

/* リターンを色に。±6% で飽和させる (それ以上は色が潰れて情報にならない) */
function retColor(x) {
  if (!isN(x)) return "#151b25";
  const t = Math.max(-1, Math.min(1, x / 0.06));
  const a = 0.10 + Math.abs(t) * 0.42;
  return t >= 0 ? `rgba(22,199,132,${a})` : `rgba(234,57,67,${a})`;
}
function scoreColor(x) {
  if (!isN(x)) return "#151b25";
  const t = Math.max(-1, Math.min(1, (x - 50) / 30));
  const a = 0.10 + Math.abs(t) * 0.42;
  return t >= 0 ? `rgba(22,199,132,${a})` : `rgba(234,57,67,${a})`;
}
function corrColor(x) {
  const t = Math.max(-1, Math.min(1, x));
  return t >= 0 ? `rgba(76,201,240,${0.06 + t * 0.62})` : `rgba(240,180,41,${0.06 + (-t) * 0.62})`;
}

/* ---------- API ---------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 503) {
    const b = await res.json().catch(() => ({}));
    throw new Error(b.message || "データ生成中");
  }
  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    throw new Error(b.error || `HTTP ${res.status}`);
  }
  return res.json();
}

/* ---------- スパークライン ---------- */
function spark(values, w = 92, h = 24) {
  const v = (values || []).filter(isN);
  if (v.length < 3) return "";
  const mn = Math.min(...v), mx = Math.max(...v);
  const rng = mx - mn || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * w},${h - ((x - mn) / rng) * h}`).join(" ");
  const up = v[v.length - 1] >= v[0];
  const c = up ? "#16c784" : "#ea3943";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle">
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.3"/></svg>`;
}

/* ---------- ソート可能テーブル ---------- */
/* cols: [{k:'field.path', t:'見出し', f:fmtFn, l:true(左寄せ), w:'幅'}] */
function table(rows, cols, opts = {}) {
  const id = "t" + Math.random().toString(36).slice(2, 8);
  const st = { key: opts.sortKey || null, dir: opts.sortDir || "desc" };

  /*
   * 行データには 2 つの形が来る:
   *   1. /api/screener の射影済み行 — キー自体が "factors.composite" (ドット込みのフラット)
   *   2. セクター集計など、そのままのオブジェクト — "heat" や入れ子の "instrument.symbol"
   * まずキーをそのまま引き、無ければ階層パスとして辿る。
   * 階層パスだけで実装すると 1 が全部 null になり、表が空欄で埋まる。
   */
  function get(r, k) {
    if (r != null && typeof r === "object" && k in r) return r[k];
    return k.split(".").reduce((a, p) => (a == null ? null : a[p]), r);
  }
  function render() {
    let data = [...rows];
    if (st.key) {
      data.sort((a, b) => {
        const av = get(a, st.key), bv = get(b, st.key);
        const an = isN(av) ? av : null, bn = isN(bv) ? bv : null;
        if (an === null && bn === null) return String(av ?? "").localeCompare(String(bv ?? ""));
        if (an === null) return 1;
        if (bn === null) return -1;
        return st.dir === "asc" ? an - bn : bn - an;
      });
    }
    const head = cols.map((c) => `<th class="${c.l ? "l" : ""} ${st.key === c.k ? "sorted" : ""}" data-k="${c.k}" title="${esc(c.title || c.t)}">${c.t}${st.key === c.k ? (st.dir === "asc" ? " ▲" : " ▼") : ""}</th>`).join("");
    const body = data.map((r) => {
      const sym = get(r, "instrument.symbol") ?? r.symbol ?? get(r, "proxySymbol");
      return `<tr class="${sym ? "click" : ""}" ${sym ? `data-sym="${esc(sym)}"` : ""}>` +
        cols.map((c) => `<td class="${c.l ? "l" : ""}">${c.f ? c.f(get(r, c.k), r) : (get(r, c.k) ?? DASH)}</td>`).join("") + "</tr>";
    }).join("");
    const el = document.getElementById(id);
    if (el) el.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
    bind();
  }
  function bind() {
    const el = document.getElementById(id);
    if (!el) return;
    el.querySelectorAll("th").forEach((th) => th.onclick = () => {
      const k = th.dataset.k;
      if (st.key === k) st.dir = st.dir === "desc" ? "asc" : "desc";
      else { st.key = k; st.dir = "desc"; }
      render();
    });
    el.querySelectorAll("tr[data-sym]").forEach((tr) => tr.onclick = () => openSymbol(tr.dataset.sym));
  }
  setTimeout(render, 0);
  return `<div class="scroll"><table id="${id}"></table></div>`;
}

function panelHeatmap(sectors) {
  const regions = [...new Set(sectors.map((s) => s.region))];
  const metric = S.heatMetric || "heat";
  const opts = [["heat", "ヒートスコア"], ["r1w", "1週リターン"], ["r1m", "1ヶ月リターン"], ["r3m", "3ヶ月リターン"], ["r12m", "12ヶ月リターン"], ["medianForwardPE", "予想PER中央値"], ["medianPB", "PBR中央値"], ["medianROE", "ROE中央値"], ["medianDividendYield", "配当利回り中央値"], ["meanTechnical", "テクニカル平均"], ["pctAbove200dma", "200日線超え比率"]];

  const body = regions.map((reg) => {
    const cells = sectors.filter((s) => s.region === reg);
    const inner = cells.map((s) => {
      const v = s[metric];
      const isRet = ["r1w", "r1m", "r3m", "r12m"].includes(metric);
      const isScore = ["heat", "meanTechnical"].includes(metric);
      const isPctPoint = metric === "pctAbove200dma";
      const bg = isRet ? retColor(v) : isScore ? scoreColor(v) : isPctPoint ? scoreColor(v) : metric === "medianROE" || metric === "medianDividendYield" ? retColor(isN(v) ? v - 0.03 : null) : scoreColor(isN(v) ? 100 - Math.min(100, v * 2.2) : null);
      const disp = !isN(v) ? "—" : isRet || metric === "medianROE" || metric === "medianDividendYield" ? `${(v * 100).toFixed(1)}%` : isScore || isPctPoint ? v.toFixed(0) : `${v.toFixed(1)}x`;
      return `<div class="hcell" style="background:${bg}" data-sym="${esc(s.proxySymbol || "")}" title="${esc(s.nameJa)} (${esc(s.region)}) — 構成${s.memberCount}銘柄">
        <div class="n">${esc(s.nameJa.replace(/^(米国|日本|欧州)\s*/, ""))}</div>
        <div class="v">${disp}</div>
        <div class="s">${isN(s.r1m) ? (s.r1m * 100).toFixed(1) + "%" : "—"} / 1M</div>
      </div>`;
    }).join("");
    return `<div class="hrow-label">${esc(regionName(reg))}</div><div style="display:flex;gap:3px;flex-wrap:wrap">${inner}</div>`;
  }).join("");

  return `<div class="panel">
    <h3>地域 × セクター ヒートマップ
      <select id="heatmetric" class="hsel">
        ${opts.map(([k, t]) => `<option value="${k}" ${k === metric ? "selected" : ""}>${t}</option>`).join("")}
      </select>
    </h3>
    <div class="heatgrid">${body}</div>
    <div class="note">ヒートスコアは 3ヶ月/1ヶ月リターン・テクニカル平均・200日線超え比率・予想PER を <b>地域内で</b> 標準化して合成したもの [0-100]。地域内で標準化するのは、通貨と市場水準の差を落とすため。クリックで代表ETFの詳細へ。</div>
  </div>`;
}

async function showGlossary(key, anchor) {
  const pop = document.getElementById("glosspop");
  try {
    if (!S.glossary) S.glossary = (await api("/api/glossary")).glossary;
    const g = S.glossary[key];
    if (!g) return;
    pop.innerHTML = `<h4>${esc(g.term)}</h4>
      <div>${esc(g.plain)}</div>
      <dl>
        <dt>高いと</dt><dd>${esc(g.high)}</dd>
        <dt>低いと</dt><dd>${esc(g.low)}</dd>
      </dl>
      <div class="trap">⚠ 落とし穴: ${esc(g.trap)}</div>`;
    pop.classList.add("on");
    const r = anchor.getBoundingClientRect();
    const w = Math.min(340, window.innerWidth - 16);
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 8;
    if (top + pop.offsetHeight > window.innerHeight - 8) {
      top = Math.max(8, r.top - pop.offsetHeight - 8);
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  } catch (e) { /* 解説が取れなくても本体の表示は妨げない */ }
}
function hideGlossary() { document.getElementById("glosspop").classList.remove("on"); }

  return `<div class="frow" data-i="${i}">
    <select data-role="field">${FIELD_CHOICES.map((c) => `<option value="${c[0]}" ${c[0] === f.field ? "selected" : ""}>${c[1]}</option>`).join("")}</select>
    <select data-role="op">${OPS.map((o) => `<option value="${o[0]}" ${o[0] === f.op ? "selected" : ""}>${o[1]}</option>`).join("")}</select>

    ${f.op === "between" ? `<input type="number" step="any" data-role="v2" value="${f.disp2 ?? ""}" placeholder="上限">` : ""}

function sectorName(id) {
  const u = S.universe;
  const m = u && u.sectors.find((x) => x.id === id);
  return m ? m.nameJa : id;
}

async function runScreen() {
  if (SCREEN.running) return;
  SCREEN.running = true;
  const el = document.getElementById("sc-result");
  if (el) el.innerHTML = `<div class="loading">検索中…</div>`;
  try {
    const body = {
      regions: SCREEN.regions.length ? SCREEN.regions : undefined,
      sectors: SCREEN.sectors.length ? SCREEN.sectors : undefined,
      roles: SCREEN.roles.length ? SCREEN.roles : undefined,
      filters: SCREEN.filters.map((f) => ({ field: f.field, op: f.op, value: f.value, value2: f.value2 })),
      sort: [{ field: SCREEN.sort, dir: SCREEN.dir }],
      limit: 300,
    };
    const res = await api("/api/screener", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    SCREEN.result = res;
    if (el) el.innerHTML = screenerTable(res);
  } catch (e) {
    if (el) el.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    SCREEN.running = false;
  }
}

function viewRotation() {
  const d = S.overview;
  const pts = d.rotation || [];
  const regions = [...new Set(pts.map((p) => p.region))];
  const sel = S.rotRegion || (regions.includes("US") ? "US" : regions[0]);
  const use = pts.filter((p) => p.region === sel);
  return `<div class="panel">
    <h3>セクターローテーション (RRG風)
      <select id="rotregion" class="hsel">
        ${regions.map((r) => `<option value="${r}" ${r === sel ? "selected" : ""}>${esc(regionName(r))}</option>`).join("")}
      </select>
    </h3>
    <div class="pad">${rrgSvg(use)}</div>
    <div class="scroll-x"><table>
      <thead><tr><th class="l">セクター</th><th class="l">象限</th><th>RS-Ratio</th><th>RS-Momentum</th></tr></thead>
      <tbody>${use.sort((a, b) => b.rsRatio - a.rsRatio).map((p) => `<tr class="click" data-sym="${esc(p.symbol)}">
        <td class="l">${esc(p.name)} <span class="muted small mono">${esc(p.symbol)}</span></td>
        <td class="l">${quadTag(p.quadrant)}</td>
        <td>${num(p.rsRatio, 1)}</td><td>${num(p.rsMomentum, 1)}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="note">
      <b>計算式 (Zスコア正規化版)</b>: RS = 100 × (セクター価格 / ベンチマーク価格) → rsRatio = 100 + 10×z₁₂₆(RS) → rsMomentum = 100 + 10×z₁₂₆(rsRatio<sub>t</sub> − rsRatio<sub>t−10</sub>)。
      本家 JdK RS-Ratio は非公開の平滑化を使うため<b>絶対値は一致しない</b>が、四象限の意味と軌跡の回転方向は同じ。軌跡は5営業日刻みで直近6点。
      通常は 改善 → 先行 → 失速 → 劣後 の順に反時計回りしない (時計回りに巡る)。
    </div>
  </div>`;
}

function quadTag(q) {
  const m = { leading: ["先行", "b"], weakening: ["失速", "c"], lagging: ["劣後", "s"], improving: ["改善", "b"] }[q] || ["", ""];
  return `<span class="tag ${m[1]}">${m[0]}</span>`;
}

function rrgSvg(pts) {
  if (!pts.length) return `<div class="muted">ローテーション座標を計算できる銘柄がまだありません (126営業日以上の履歴が必要)。</div>`;
  const W = 720, H = 520, P = 44;
  const xs = pts.flatMap((p) => [p.rsRatio, ...p.trail.map((t) => t.rsRatio)]);
  const ys = pts.flatMap((p) => [p.rsMomentum, ...p.trail.map((t) => t.rsMomentum)]);
  const pad = 3;
  const x0 = Math.min(90, Math.min(...xs) - pad), x1 = Math.max(110, Math.max(...xs) + pad);
  const y0 = Math.min(90, Math.min(...ys) - pad), y1 = Math.max(110, Math.max(...ys) + pad);
  const X = (v) => P + ((v - x0) / (x1 - x0)) * (W - P * 2);
  const Y = (v) => H - P - ((v - y0) / (y1 - y0)) * (H - P * 2);
  const cx = X(100), cy = Y(100);

  const quads = `
    <rect x="${cx}" y="${P}" width="${W - P - cx}" height="${cy - P}" fill="rgba(22,199,132,.05)"/>
    <rect x="${cx}" y="${cy}" width="${W - P - cx}" height="${H - P - cy}" fill="rgba(240,180,41,.05)"/>
    <rect x="${P}" y="${cy}" width="${cx - P}" height="${H - P - cy}" fill="rgba(234,57,67,.05)"/>
    <rect x="${P}" y="${P}" width="${cx - P}" height="${cy - P}" fill="rgba(76,201,240,.05)"/>
    <text x="${W - P - 6}" y="${P + 16}" text-anchor="end" fill="#16c784" font-size="11">先行 Leading</text>
    <text x="${W - P - 6}" y="${H - P - 6}" text-anchor="end" fill="#f0b429" font-size="11">失速 Weakening</text>
    <text x="${P + 6}" y="${H - P - 6}" fill="#ea3943" font-size="11">劣後 Lagging</text>
    <text x="${P + 6}" y="${P + 16}" fill="#4cc9f0" font-size="11">改善 Improving</text>`;

  const marks = pts.map((p, i) => {
    const hue = (i * 47) % 360;
    const col = `hsl(${hue},68%,62%)`;
    const trail = p.trail.map((t) => `${X(t.rsRatio)},${Y(t.rsMomentum)}`).join(" ");
    return `<polyline points="${trail}" fill="none" stroke="${col}" stroke-width="1.1" opacity=".45"/>
      ${p.trail.slice(0, -1).map((t) => `<circle cx="${X(t.rsRatio)}" cy="${Y(t.rsMomentum)}" r="1.8" fill="${col}" opacity=".4"/>`).join("")}
      <circle cx="${X(p.rsRatio)}" cy="${Y(p.rsMomentum)}" r="6" fill="${col}" stroke="#0a0d12" stroke-width="1.5"/>
      <text x="${X(p.rsRatio) + 9}" y="${Y(p.rsMomentum) + 4}" fill="#d7dee9" font-size="10.5">${esc(p.name.replace(/^(米国|日本|欧州)\s*/, ""))}</text>`;
  }).join("");

  return `<div class="rrgwrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto">
    <rect x="${P}" y="${P}" width="${W - P * 2}" height="${H - P * 2}" fill="#0e131c" stroke="#1e2735"/>
    ${quads}
    <line x1="${cx}" y1="${P}" x2="${cx}" y2="${H - P}" stroke="#2a3547" stroke-dasharray="3 3"/>
    <line x1="${P}" y1="${cy}" x2="${W - P}" y2="${cy}" stroke="#2a3547" stroke-dasharray="3 3"/>
    ${marks}
    <text x="${W / 2}" y="${H - 12}" text-anchor="middle" fill="#7b8798" font-size="11">RS-Ratio (相対力) →</text>
    <text x="14" y="${H / 2}" text-anchor="middle" fill="#7b8798" font-size="11" transform="rotate(-90 14 ${H / 2})">RS-Momentum (相対力の変化) →</text>
  </svg></div>`;
}

function viewRisk() {
  const c = S.overview.correlation;
  if (!c) return `<div class="panel"><h3>相関</h3><div class="pad muted">相関行列を計算できる銘柄がまだ揃っていません。</div></div>`;
  const n = c.symbols.length;
  // 縦書きの列見出しは長いほど上に伸びて見切れる。地域の接頭辞を落として
  // 短くし、完全な名前は title に残す (行側の見出しはフルのまま出している)
  const shortLabel = (l) => l.replace(/^(米国|日本|欧州|英国)\s*/, "");
  const head = c.labels.map((l, i) =>
    `<th title="${esc(l)} (${esc(c.symbols[i])})" style="writing-mode:vertical-rl;height:112px;vertical-align:bottom;font-weight:500;white-space:nowrap">${esc(shortLabel(l))}</th>`
  ).join("");
  const body = c.labels.map((l, i) => `<tr>
    <td class="l" style="position:sticky;left:0;background:var(--panel);font-family:var(--sans)">${esc(l)}</td>
    ${c.symbols.map((_, j) => {
      const v = c.matrix[i * n + j];
      return `<td style="background:${corrColor(v)};padding:3px 5px" title="${esc(c.labels[i])} × ${esc(c.labels[j])} = ${v.toFixed(2)}">${i === j ? "" : v.toFixed(2)}</td>`;
    }).join("")}</tr>`).join("");

  const div = c.clusters.map((cl) => `<div style="margin-bottom:6px"><span class="tag">クラスタ ${cl.id + 1}</span>
    <span class="small">${cl.symbols.map((s) => esc(labelOf(c, s))).join(" · ")}</span></div>`).join("");

  const loadings = c.symbols.map((s, i) => ({ s, l: c.pc1Loadings[i], n: c.labels[i] })).sort((a, b) => Math.abs(b.l) - Math.abs(a.l));

  return `
  <div class="grid cols-main-fixed">
    <div class="panel">
      <h3>相関行列 <span class="hint">直近${c.window}営業日の対数リターン</span></h3>
      <div class="scroll" style="max-height:70vh"><table style="font-size:10.5px">
        <thead><tr><th class="l" style="position:sticky;left:0;background:var(--panel2)"></th>${head}</tr></thead>
        <tbody>${body}</tbody></table></div>
    </div>
    <div>
      <div class="panel">
        <h3>分散の実効度</h3>
        <div class="pad">
          <dl class="kv">
            <dt>平均ペア相関</dt><dd class="${c.meanPairwise > 0.6 ? "neg" : c.meanPairwise < 0.3 ? "pos" : ""}">${c.meanPairwise.toFixed(3)}</dd>
            <dt>第1主成分の寄与率</dt><dd class="${c.pc1Share > 0.6 ? "neg" : ""}">${(c.pc1Share * 100).toFixed(1)}%</dd>

async function openSymbol(sym) {
  if (!sym) return;
  const modal = document.getElementById("modal");
  const sheet = document.getElementById("sheet");
  modal.classList.add("on");
  // 背面のページをスクロールさせない。これをやらないと、スマホでシートを
  // 送ったつもりが後ろの一覧だけが動き、閉じたときに全く違う位置にいる
  document.body.style.overflow = "hidden";
  modal.scrollTop = 0;
  sheet.innerHTML = `<div class="loading">${esc(sym)} を読み込み中…</div>`;
  try {
    const [d, hist] = await Promise.all([
      api(`/api/symbol/${encodeURIComponent(sym)}`),
      api(`/api/history/${encodeURIComponent(sym)}?points=300`).catch(() => null),
    ]);
    sheet.innerHTML = symbolSheet(d, hist);
    sheet.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeModal);
    sheet.querySelectorAll("tr[data-sym]").forEach((tr) => tr.onclick = () => openSymbol(tr.dataset.sym));
  } catch (e) {
    sheet.innerHTML = `<div class="sheet-h"><h2>${esc(sym)}</h2><span class="spacer"></span><button class="close" data-close>✕</button></div><div class="err">${esc(e.message)}</div>`;
    sheet.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeModal);
  }
}
function closeModal() {
  document.getElementById("modal").classList.remove("on");
  document.body.style.overflow = "";
}

function priceChart(hist, t) {
  const bars = hist.bars || [];
  if (bars.length < 20) return `<div class="muted">描画に足りるバーがありません。</div>`;
  const W = 1180, H = 300, VH = 56, RH = 70, P = 46;
  const cs = bars.map((b) => b.c);
  const mn = Math.min(...bars.map((b) => b.l)), mx = Math.max(...bars.map((b) => b.h));
  const rng = (mx - mn) || 1;
  const X = (i) => P + (i / (bars.length - 1)) * (W - P - 12);
  const Y = (v) => H - 18 - ((v - mn) / rng) * (H - 30);

  function sma(n) {
    const o = []; let s = 0;
    for (let i = 0; i < cs.length; i++) { s += cs[i]; if (i >= n) s -= cs[i - n]; o.push(i >= n - 1 ? s / n : null); }
    return o;
  }
  const line = (arr, col, w) => {
    const pts = arr.map((v, i) => (isN(v) ? `${X(i)},${Y(v)}` : null)).filter(Boolean).join(" ");
    return pts ? `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w}"/>` : "";
  };

  const grid = [0, .25, .5, .75, 1].map((q) => {
    const v = mn + rng * q;
    return `<line x1="${P}" y1="${Y(v)}" x2="${W - 12}" y2="${Y(v)}" stroke="#1a2230"/>
      <text x="${P - 6}" y="${Y(v) + 4}" text-anchor="end" fill="#5c6779" font-size="10" font-family="monospace">${v.toFixed(v > 1000 ? 0 : 2)}</text>`;
  }).join("");

  // 出来高
  const vols = bars.map((b) => b.v).filter(isN);
  const vmax = vols.length ? Math.max(...vols) : 0;
  const volBars = vmax > 0 ? bars.map((b, i) => {
    if (!isN(b.v)) return "";
    const h = (b.v / vmax) * (VH - 6);
    const up = i === 0 || b.c >= bars[i - 1].c;
    return `<rect x="${X(i) - 1}" y="${H + VH - 4 - h}" width="2" height="${h}" fill="${up ? "#16c78455" : "#ea394355"}"/>`;
  }).join("") : `<text x="${P}" y="${H + 30}" fill="#5c6779" font-size="10">出来高データなし</text>`;

  // RSI
  function rsiSeries(n) {
    const out = new Array(cs.length).fill(null);
    if (cs.length <= n) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= n; i++) { const dd = cs[i] - cs[i - 1]; if (dd > 0) g += dd; else l -= dd; }
    g /= n; l /= n;
    out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = n + 1; i < cs.length; i++) {
      const dd = cs[i] - cs[i - 1];
      g = (g * (n - 1) + Math.max(0, dd)) / n;
      l = (l * (n - 1) + Math.max(0, -dd)) / n;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  }
  const rsi = rsiSeries(14);
  const RY = (v) => H + VH + 12 + (RH - 16) * (1 - v / 100);
  const rsiPts = rsi.map((v, i) => (isN(v) ? `${X(i)},${RY(v)}` : null)).filter(Boolean).join(" ");

  const tot = H + VH + RH + 16;
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${tot}" style="width:100%;height:auto">
    ${grid}
    ${line(cs, "#d7dee9", 1.4)}
    ${line(sma(50), "#4cc9f0", 1.1)}
    ${line(sma(200), "#b892ff", 1.1)}
    <text x="${P}" y="${P - 24}" fill="#4cc9f0" font-size="10">— 50日線</text>
    <text x="${P + 60}" y="${P - 24}" fill="#b892ff" font-size="10">— 200日線</text>
    ${volBars}
    <line x1="${P}" y1="${RY(70)}" x2="${W - 12}" y2="${RY(70)}" stroke="#ea394344" stroke-dasharray="2 3"/>
    <line x1="${P}" y1="${RY(30)}" x2="${W - 12}" y2="${RY(30)}" stroke="#16c78444" stroke-dasharray="2 3"/>
    ${rsiPts ? `<polyline points="${rsiPts}" fill="none" stroke="#f0b429" stroke-width="1.1"/>` : ""}
    <text x="${P - 6}" y="${RY(70) + 3}" text-anchor="end" fill="#5c6779" font-size="9" font-family="monospace">70</text>
    <text x="${P - 6}" y="${RY(30) + 3}" text-anchor="end" fill="#5c6779" font-size="9" font-family="monospace">30</text>
    <text x="${P}" y="${H + VH + 8}" fill="#5c6779" font-size="10">RSI(14)</text>
  </svg></div>
  <div class="small muted" style="text-align:right">${esc(hist.source)} · ${bars.length}本 · ${esc(bars[0] ? new Date(bars[0].t*1000).toISOString().slice(0,10) : "")} 〜 ${esc(bars.length ? new Date(bars[bars.length-1].t*1000).toISOString().slice(0,10) : "")}</div>`;
}

function metricRows(card) {
  if (!card) return `<div class="muted small">ファンダメンタルズ未取得</div>`;

    const disp = !isN(m.value) ? "—"
      : m.unit === "%" ? pctPlain(m.value, 1)
      : m.unit === "x" ? m.value.toFixed(2) + "x"
      : m.value.toFixed(2);
    const med = !isN(m.peerMedian) ? "—"
      : m.unit === "%" ? pctPlain(m.peerMedian, 1)
      : m.unit === "x" ? m.peerMedian.toFixed(2) + "x"
      : m.peerMedian.toFixed(2);
    const w = isN(m.percentile) ? m.percentile : 0;
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <span class="small" style="width:130px;color:var(--muted)" title="${m.lowerIsBetter ? "小さいほど良い" : "大きいほど良い"}">${esc(m.label)}</span>
      <span class="mono small" style="width:62px;text-align:right">${disp}</span>

      <span class="mono small muted" style="width:56px;text-align:right" title="セクター中央値">${med}</span>

  }).join("");
}

  const dist = c.trend && c.trend.length ? c.trend : [];
  return `<div class="panel">

    <div class="pad">

        <dt>レーティング平均</dt><dd>${num(c.recommendationMean, 2)} <span class="muted small">${esc(c.recommendationKey || "")}</span></dd>
        <dt>アナリスト数</dt><dd>${c.analystCount ?? DASH}</dd>
        <dt>目標株価 平均</dt><dd>${num(c.targetMean, 2)}</dd>
        <dt>目標株価 高値/安値</dt><dd>${num(c.targetHigh, 2)} / ${num(c.targetLow, 2)}</dd>
        <dt>現値からの乖離</dt><dd>${pct(c.upsideToTarget)}</dd>
        <dt>見方のばらつき</dt><dd>${num(c.targetDispersion, 2)}</dd>
        <dt>レーティング改定 (3ヶ月)</dt><dd class="${isN(c.ratingMomentum) ? (c.ratingMomentum > 0 ? "pos" : c.ratingMomentum < 0 ? "neg" : "") : ""}">${num(c.ratingMomentum, 2)}</dd>
        ${c.epsRevision ? `<dt>EPS改定 (30日)</dt><dd><span class="pos">↑${c.epsRevision.up}</span> / <span class="neg">↓${c.epsRevision.down}</span></dd>` : ""}
      </dl>
      ${dist.length ? `<div style="margin-top:10px"><div class="muted small" style="margin-bottom:4px">推奨分布の推移</div>
        <table style="font-size:11px"><thead><tr><th class="l">時期</th><th>強気買</th><th>買</th><th>中立</th><th>売</th><th>強気売</th></tr></thead>
        <tbody>${dist.map((d) => `<tr><td class="l">${esc(d.period)}</td><td class="pos">${d.strongBuy}</td><td class="pos">${d.buy}</td><td>${d.hold}</td><td class="neg">${d.sell}</td><td class="neg">${d.strongSell}</td></tr>`).join("")}</tbody></table></div>` : ""}
      <div class="note" style="border:none;padding:8px 0 0">レーティング平均は 1=強気買 … 5=強気売 (Yahoo 準拠)。目標株価は構造的に上方バイアスがあるため、水準そのものより<b>改定の方向</b>を見るのが実務。</div>
    </div>
  </div>`;
}

function panelSignals(sigs) {
  if (!sigs || !sigs.length) return `<div class="panel"><h3>シグナル</h3><div class="pad muted">検出されたシグナルはありません。</div></div>`;
  const cls = { bullish: "bull", bearish: "bear", caution: "caut" };
  const lab = { bullish: ["強気", "b"], bearish: ["弱気", "s"], caution: ["注意", "c"] };
  return `<div class="panel">
    <h3>シグナル <span class="hint">観測された事実とその解釈 (売買推奨ではない)</span></h3>
    <div class="pad">
      ${sigs.map((s) => `<div class="sig ${cls[s.direction]}">
        <div class="t">${esc(s.title)} <span class="tag ${lab[s.direction][1]}">${lab[s.direction][0]}</span>
          <span class="muted small">${"★".repeat(s.strength)}</span></div>
        <div class="d">${esc(s.detail)}</div></div>`).join("")}
    </div>
  </div>`;
}

function panelFactors(f) {
  if (!f) return `<div class="panel"><h3>ファクター</h3><div class="pad muted">合成に必要なデータが揃っていません。</div></div>`;
  const rows = [["value", "割安", f.value], ["quality", "質", f.quality], ["momentum", "勢い", f.momentum], ["growth", "成長", f.growth], ["lowVol", "低ボラ", f.lowVol]];
  return `<div class="panel">
    <h3>ファクター分解 <span class="hint">${f.rank ? `${f.rank}位 / ${f.peerCount}銘柄` : ""}</span></h3>
    <div class="pad">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:26px;font-weight:700" class="mono">${isN(f.composite) ? f.composite.toFixed(0) : "—"}</span>
        <span class="muted small">総合スコア<br>
          <span title="合成に使えたウェイトの割合。ETFや指数はファンダが存在しないため 0.35 前後になる">
            カバレッジ ${isN(f.coverage) ? (f.coverage * 100).toFixed(0) + "%" : "—"}</span></span>
      </div>
      ${isN(f.coverage) && f.coverage < 0.6 ? `<div class="small warn" style="margin-bottom:8px">⚠ 一部のファクターしか使えていないため、フルカバレッジの銘柄と同じ土俵の比較ではありません。</div>` : ""}
      ${rows.map(([k, l, v]) => {
        const contrib = (f.contributions || []).find((c) => c.factor === k);
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span class="small" style="width:44px;color:var(--muted)">${l}</span>
          <div class="bar" style="flex:1"><i style="width:${isN(v) ? v : 0}%;background:${isN(v) && v >= 65 ? "#16c784" : isN(v) && v <= 35 ? "#ea3943" : "#556"}"></i></div>
          <span class="mono small" style="width:34px;text-align:right">${isN(v) ? v.toFixed(0) : "—"}</span>
          <span class="mono small muted" style="width:66px;text-align:right" title="ウェイト × Zスコア">${contrib ? `w${(contrib.weight * 100).toFixed(0)}% ${contrib.contribution >= 0 ? "+" : ""}${contrib.contribution.toFixed(2)}` : ""}</span>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function panelLevels(t, p) {
  const L = t.levels || { support: [], resistance: [] };
  const pv = t.pivots, fp = t.fibPivots;
  const row = (x, kind) => `<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0">
    <span class="mono ${kind}">${num(x.level, 2)}</span>
    <span class="muted small">${x.touches}回反応</span>
    <span class="mono ${x.distancePct >= 0 ? "pos" : "neg"}">${(x.distancePct * 100).toFixed(1)}%</span></div>`;
  return `<div class="panel">
    <h3>支持・抵抗 <span class="hint">スイング高安のクラスタ / 直近180日</span></h3>
    <div class="pad">
      <div class="muted small">抵抗帯</div>
      ${L.resistance.length ? L.resistance.slice().reverse().map((x) => row(x, "neg")).join("") : `<div class="muted small">検出なし</div>`}
      <div style="border-top:1px dashed var(--line);margin:6px 0;padding-top:4px"></div>
      <div class="mono" style="text-align:center">現値 ${num(p.last, 2)}</div>
      <div style="border-top:1px dashed var(--line);margin:6px 0;padding-top:4px"></div>
      <div class="muted small">支持帯</div>
      ${L.support.length ? L.support.map((x) => row(x, "pos")).join("") : `<div class="muted small">検出なし</div>`}
      ${pv ? `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">
        <div class="muted small" style="margin-bottom:3px">ピボット (前日足ベース)</div>
        <table style="font-size:11px"><thead><tr><th class="l">方式</th><th>S2</th><th>S1</th><th>P</th><th>R1</th><th>R2</th></tr></thead><tbody>
        <tr><td class="l">クラシック</td><td>${num(pv.s2,2)}</td><td>${num(pv.s1,2)}</td><td>${num(pv.pivot,2)}</td><td>${num(pv.r1,2)}</td><td>${num(pv.r2,2)}</td></tr>
        ${fp ? `<tr><td class="l">フィボナッチ</td><td>${num(fp.s2,2)}</td><td>${num(fp.s1,2)}</td><td>${num(fp.pivot,2)}</td><td>${num(fp.r1,2)}</td><td>${num(fp.r2,2)}</td></tr>` : ""}
        </tbody></table></div>` : ""}
    </div>
  </div>`;
}

function panelRelated(rel) {
  if (!rel || !rel.length) {
    return `<div class="panel"><h3>関連銘柄</h3><div class="pad muted">
      関連の算出はシャード更新時に行われます。この銘柄はまだ更新待ちです。</div></div>`;
  }
  // 種類ごとにまとめる。「関連銘柄」を一列に並べると、
  // 比較対象なのか分散候補なのかが混ざって使い道が分からなくなる
  const order = ["sector-peer", "theme", "co-moving", "diversifier", "factor-twin", "macro-driver"];
  const help = {
    "sector-peer": "割高/割安を判断する物差し。この銘柄の数字は、この人たちと比べて初めて意味を持つ",
    theme: "供給網やテーマで繋がる銘柄。需要の波及に順序がある",
    "co-moving": "値動きが揃う。両方持っても分散にならない",
    diversifier: "連動しない、または逆に動く。組み合わせると値動きが穏やかになる",
    "factor-twin": "割安さ・質・勢いの構成が似ている。同じ狙いで買える代替候補",
    "macro-driver": "この銘柄を動かしているマクロ要因。何を見張ればいいかが分かる",
  };
  const groups = order
    .map((k) => ({ k, items: rel.filter((r) => r.kind === k) }))
    .filter((g) => g.items.length > 0);

  return `<div class="panel">
    <h3>関連銘柄 <span class="hint">関係の種類ごとに意味が違う</span></h3>
    <div class="pad">
      ${groups.map((g) => `<div style="margin-bottom:12px">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:3px">
          <span class="tag">${esc(g.items[0].kindLabel)}</span>
          <span class="muted small">${esc(help[g.k] || "")}</span>
        </div>
        ${g.items.map((r) => `<div style="border-left:2px solid var(--line);padding:4px 0 4px 9px;margin-bottom:5px">
          <div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
            <span class="click" data-open="${esc(r.symbol)}" style="cursor:pointer;font-weight:600">${esc(r.nameJa)}</span>
            <span class="mono muted small">${esc(r.symbol)}</span>
            <div class="bar" style="width:52px" title="関係の強さ ${r.strength}">
              <i style="width:${Math.round(r.strength * 100)}%;background:var(--accent)"></i></div>
            <span class="mono small muted">${esc(r.evidence)}</span>
          </div>
          <div class="small muted" style="margin-top:2px;line-height:1.6">${esc(r.plain)}</div>
        </div>`).join("")}
      </div>`).join("")}
    </div>
  </div>`;
}

function panelPeers(peers) {
  if (!peers || !peers.length) return "";
  return `<div class="panel">
    <h3>同セクターのピア</h3>
    <div class="scroll" style="max-height:260px"><table>
      <thead><tr><th class="l">銘柄</th><th>予想PER</th><th>PBR</th><th>ROE</th><th>3ヶ月</th><th>総合</th></tr></thead>
      <tbody>${peers.map((p) => `<tr class="click" data-sym="${esc(p.symbol)}">
        <td class="l">${esc(p.nameJa)}</td>
        <td>${mult(p.forwardPE)}</td><td>${mult(p.priceToBook, 2)}</td>
        <td>${isN(p.returnOnEquity) ? pctPlain(p.returnOnEquity) : DASH}</td>
        <td>${pct(p.r3m)}</td><td>${score(p.composite)}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

function panelProvenance(r) {
  const f = r.fundamentals;
  const src = f && f.fieldSources ? Object.entries(f.fieldSources) : [];
  return `<div class="panel">
    <h3>データの出所 <span class="hint">どの数字がどこから来たか</span></h3>
    <div class="pad">
      <dl class="kv">
        <dt>価格ソース</dt><dd>${esc(r.dataQuality.priceSource)}</dd>
        <dt>バー数</dt><dd>${r.dataQuality.bars}</dd>
        <dt>最終営業日</dt><dd>${esc(r.dataQuality.lastBarDate)}</dd>
        <dt>ファンダ取得元</dt><dd class="small">${esc(r.dataQuality.fundamentalsSource || "未取得")}</dd>
        <dt>ファンダ基準時刻</dt><dd class="small">${f ? when(f.asOf) : "—"}</dd>
      </dl>
      ${r.dataQuality.warnings.length ? `<div style="margin-top:8px">${r.dataQuality.warnings.map((w) => `<div class="small warn">⚠ ${esc(w)}</div>`).join("")}</div>` : ""}
      ${src.length ? `<details style="margin-top:8px"><summary class="muted small" style="cursor:pointer">フィールド単位の出所 (${src.length}件)</summary>
        <div class="mono small muted" style="max-height:180px;overflow:auto;margin-top:4px">
          ${src.map(([k, v]) => `<div>${esc(k)} ← ${esc(v)}</div>`).join("")}</div></details>` : ""}
    </div>
  </div>`;
}

/* ================================================================== *
 * ルーティングとイベント
 * ================================================================== */
const TABS = [
  ["overview", "概況", viewOverview],
  ["ideas", "銘柄アイデア", viewIdeas],
  ["sectors", "セクター", viewSectors],
  ["screener", "スクリーナー", viewScreener],
  ["rotation", "ローテーション", viewRotation],
  ["risk", "リスク・相関", viewRisk],
];

function renderNav() {
  document.getElementById("nav").innerHTML = TABS.map(([k, t]) =>
    `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${t}</button>`).join("");
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; render(); });
}

function renderChips() {
  const d = S.overview;
  const el = document.getElementById("regimechips");
  if (!d || !d.regime) { el.innerHTML = ""; return; }
  const r = d.regime;
  const t = { bull: ["上昇基調", "#16c784"], bear: ["下降基調", "#ea3943"], range: ["レンジ", "#f0b429"] }[r.trend];
  const v = { low: ["低ボラ", "#16c784"], normal: ["平常", "#7b8798"], elevated: ["警戒", "#f0b429"], stress: ["ストレス", "#ea3943"] }[r.volatility];
  const a = { "risk-on": ["リスクオン", "#16c784"], neutral: ["中立", "#7b8798"], "risk-off": ["リスクオフ", "#ea3943"] }[r.riskAppetite];
  el.innerHTML = [t, v, a].map(([txt, col]) => `<span class="chip"><span class="dot" style="background:${col}"></span>${txt}</span>`).join("");
  document.getElementById("stamp").textContent = "更新 " + when(d.generatedAt);
}

function render() {
  renderNav();
  const view = document.getElementById("view");
  const tab = TABS.find(([k]) => k === S.tab);
  try {
    view.innerHTML = tab ? tab[2]() : "";
  } catch (e) {
    view.innerHTML = `<div class="err">描画エラー: ${esc(e.message)}</div>`;
    return;
  }
  attach();
}

function attach() {
  const hm = document.getElementById("heatmetric");
  if (hm) hm.onchange = () => { S.heatMetric = hm.value; render(); };
  const sr = document.getElementById("secregion");
  if (sr) sr.onchange = () => { S.secRegion = sr.value; render(); };
  const rr = document.getElementById("rotregion");
  if (rr) rr.onchange = () => { S.rotRegion = rr.value; render(); };

  // data-sym を持つ要素はすべてクリックで個別詳細へ。
  // table() が生成した行は table() 側で既に onclick を張っているので上書きしない。
  // (以前は「TR は table() 側で処理済み」として全 TR を除外していたが、
  //  マクロ表のように手書きした行にはハンドラが付かず、cursor:pointer なのに
  //  タップしても無反応という状態になっていた)
  document.querySelectorAll("[data-sym]").forEach((el) => {
    if (el.onclick) return;
    el.onclick = () => openSymbol(el.dataset.sym);
  });

  // アイデアカードから個別詳細へ
  document.querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); openSymbol(el.dataset.open); };
  });

  // 用語解説。タップ環境でも使えるよう click で開閉する
  document.querySelectorAll("[data-gl]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); showGlossary(el.dataset.gl, el); };
  });

  const ipb = document.getElementById("idea-pb");
  if (ipb) ipb.onchange = () => { S.ideaPlaybook = ipb.value; render(); };
  const ireg = document.getElementById("idea-reg");
  if (ireg) ireg.onchange = () => { S.ideaRegion = ireg.value; render(); };

  // スクリーナー
  const add = document.getElementById("sc-add");
  if (add) {
    add.onclick = () => { SCREEN.filters.push({ field: "fundamentals.forwardPE", op: "lte", value: 20, disp: 20 }); SCREEN.preset = null; render(); };
    document.getElementById("sc-clear").onclick = () => { SCREEN.filters = []; SCREEN.preset = null; SCREEN.result = null; render(); };
    document.getElementById("sc-run").onclick = runScreen;
    const rsel = document.getElementById("sc-region");
    rsel.onchange = () => { SCREEN.regions = [...rsel.selectedOptions].map((o) => o.value); };
    const ssel = document.getElementById("sc-sector");
    ssel.onchange = () => { SCREEN.sectors = [...ssel.selectedOptions].map((o) => o.value); };
    const rolesel = document.getElementById("sc-role");
    rolesel.onchange = () => { SCREEN.roles = rolesel.value ? [rolesel.value] : []; };

    document.querySelectorAll("#sc-filters .frow").forEach((row) => {
      const i = Number(row.dataset.i);
      const f = SCREEN.filters[i];
      const meta = FIELD_CHOICES.find((c) => c[0] === f.field);
      const isRatio = meta && meta[2] === "r";
      row.querySelector('[data-role="field"]').onchange = (e) => { f.field = e.target.value; render(); };
      row.querySelector('[data-role="op"]').onchange = (e) => { f.op = e.target.value; render(); };
      const v = row.querySelector('[data-role="v"]');
      if (v) v.oninput = (e) => {
        const raw = parseFloat(e.target.value);
        f.disp = e.target.value;
        f.value = isFinite(raw) ? (isRatio ? raw / 100 : raw) : undefined;
      };
      const v2 = row.querySelector('[data-role="v2"]');
      if (v2) v2.oninput = (e) => {
        const raw = parseFloat(e.target.value);
        f.disp2 = e.target.value;
        f.value2 = isFinite(raw) ? (isRatio ? raw / 100 : raw) : undefined;
      };
      row.querySelector('[data-role="del"]').onclick = () => { SCREEN.filters.splice(i, 1); render(); };
    });

    document.querySelectorAll("[data-preset]").forEach((b) => b.onclick = async () => {
      SCREEN.preset = b.dataset.preset;
      const p = S.presets.presets.find((x) => x.id === SCREEN.preset);
      const el = document.getElementById("sc-result");
      el.innerHTML = `<div class="loading">検索中…</div>`;
      try {
        const res = await api(`/api/screener?preset=${encodeURIComponent(SCREEN.preset)}&limit=300`);
        SCREEN.result = res;
        SCREEN.filters = [];
        render();
      } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    });
  }
}

document.getElementById("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); hideGlossary(); } });
document.addEventListener("click", (e) => {
  const pop = document.getElementById("glosspop");
  if (pop.classList.contains("on") && !pop.contains(e.target)) hideGlossary();
});
window.addEventListener("scroll", hideGlossary, { passive: true });

document.getElementById("refresh").onclick = async () => {
  const b = document.getElementById("refresh");
  b.disabled = true; b.textContent = "更新中…";
  try {
    await fetch("/api/refresh", { method: "POST" });
    await boot();
  } catch (e) { /* 表示は boot 側で扱う */ }
  b.disabled = false; b.textContent = "更新";
};

async function boot() {
  const view = document.getElementById("view");
  try {
    const [ov, uni, pre] = await Promise.all([
      api("/api/overview"),
      S.universe ? Promise.resolve(S.universe) : api("/api/universe"),
      S.presets ? Promise.resolve(S.presets) : api("/api/presets"),
    ]);
    S.overview = ov; S.universe = uni; S.presets = pre;
    renderChips();
    render();
  } catch (e) {
    view.innerHTML = `<div class="panel"><div class="pad">
      <div class="err">${esc(e.message)}</div>
      <div class="muted small" style="margin-top:8px">初回はユニバースの収集に数十秒かかります。15秒後に自動で再試行します。</div>
    </div></div>`;
    setTimeout(boot, 15000);
  }
}
boot();
</script>
