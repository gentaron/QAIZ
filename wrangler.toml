# QAIZ — Quantum-geometric AI Zone
# Cloudflare Workers 無料プランのみで動作する構成。
#
# デプロイ: `npx wrangler deploy` だけでOK。
# ストレージは Durable Object (SQLite) を使うため、KV のような
# 手動ネームスペース作成や ID の貼り付けは一切不要 (デプロイ時に自動作成)。
name = "qaiz"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# 静的ダッシュボード (public/) を Worker と同一オリジンで配信 (無料)
[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI (無料枠: 1日あたり 10,000 Neurons)。
# 使用モデルは Meta Llama 系 (非Google)。src/ai/sentiment.ts 参照。
[ai]
binding = "AI"

# スナップショット保存用 Durable Object (SQLite バックエンド = 無料プラン対応)
[[durable_objects.bindings]]
name = "SNAPSHOT_DO"
class_name = "SnapshotStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SnapshotStore"]

# 1時間ごとにデータ収集 → スコア計算 → 保存 (無料プランで cron 利用可)
[triggers]
crons = ["0 * * * *"]

[vars]
# センチメント分析に使うモデル (Workers AI / Meta Llama — 非Google)
SENTIMENT_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# 任意: 無料APIキーを追加したい場合は `wrangler secret put FINNHUB_KEY` などで
# secret として登録する (コードは未設定でも動作するように書かれている)
