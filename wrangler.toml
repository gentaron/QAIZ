# QAIZ — Quantitative Analyst Intelligence Zone
# Cloudflare Workers 無料プランのみで動作する構成。
#
# デプロイ: `npx wrangler deploy` だけでOK。
# ストレージは Durable Object (SQLite) を使うため、KV のような
# 手動ネームスペース作成や ID の貼り付けは一切不要 (デプロイ時に自動作成)。
name = "qaiz"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# 静的ダッシュボード (public/) を Worker と同一オリジンで配信 (無料)
[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI (無料枠: 1日あたり 10,000 Neurons)。
# ニュースのセンチメント判定にのみ使う。未設定でもレキシコンで動作する。
[ai]
binding = "AI"

# 分析結果・価格系列の保存先 (SQLite バックエンド = 無料プラン対応)
[[durable_objects.bindings]]
name = "STORE"
class_name = "AnalyticsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SnapshotStore"]

# v0.2 の量子OS版から作り直したため、旧クラスを破棄して新クラスに差し替える。
# 旧スナップショットは構造が違うので引き継がない (残しても型が合わず読めない)。
[[migrations]]
tag = "v2"
deleted_classes = ["SnapshotStore"]
new_sqlite_classes = ["AnalyticsStore"]

# 15分ごとに 1 シャードを更新する。SHARDS=8 なので約 2 時間で全銘柄が一巡する。
# 日次バーが対象なので、この頻度で十分に新しい。
[triggers]
crons = ["*/15 * * * *"]

[vars]
# センチメント分析に使うモデル (Workers AI / Meta Llama)
SENTIMENT_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# ユニバースの分割数。1 実行で回す銘柄数 = ceil(ユニバース / SHARDS)。
# 「CPU time limit exceeded」が出るようなら増やす (1 回あたりが軽くなる)。
SHARDS = "8"

# 1 実行あたりの外部フェッチ上限。Workers 無料プランのサブリクエスト上限
# (50本/実行) の内側に置く。超えた銘柄は次のシャード巡回で拾われ、
# スキップされた事実は /api/meta の errors に "budget-skip:" として残る。
FETCH_BUDGET = "44"

# ファクター合成のウェイト (JSON)。合計は自動で正規化される。
# 例: バリュー寄りにするなら {"value":0.4,"quality":0.2,"momentum":0.2,"growth":0.1,"lowVol":0.1}
FACTOR_WEIGHTS = '{"value":0.25,"quality":0.25,"momentum":0.25,"growth":0.15,"lowVol":0.10}'

# 任意: 有料プランなら CPU 上限を引き上げられる。無料プランでは無視される。
# [limits]
# cpu_ms = 30000
