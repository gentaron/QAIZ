name: CI

# 型検査と分析エンジンのテスト。ネットワークにも Cloudflare にも触らないので、
# fork からの PR でも Secret なしで完走する。
on:
  push:
    branches: [main]
  # ベースを絞らない。作業ブランチ同士の PR (機能ブランチに積み上げる運用) でも
  # 型検査とテストを回すため。branches: [main] を付けていると、そういう PR は
  # GitHub 側で除外されてチェックが 1 つも走らず、「赤くないから通っている」と
  # 誤解される状態になる。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ が必要。テストは .ts を直接実行しており、
      # ネイティブの型ストリッピングに依存している。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
