name: CI

# 型検査・分析エンジンのテスト・研究ラボのテスト。
# ネットワークにも Cloudflare にも外部データソースにも触らないので、
# fork からの PR でも Secret なしで完走する。
#
# 研究ラボのテストが合成データだけで完結しているのは意図的な設計で、
# 「API キーが無いと検証できない研究基盤」は他人が再現できない。
on:
  push:
    branches: [main]
  # ベースを絞らない。作業ブランチ同士の PR (機能ブランチに積み上げる運用) でも
  # 型検査とテストを回すため。branches: [main] を付けていると、そういう PR は
  # GitHub 側で除外されてチェックが 1 つも走らず、「赤くないから通っている」と
  # 誤解される状態になる。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Node 22.18+ が必要。テストは .ts を直接実行しており、
      # ネイティブの型ストリッピングに依存している。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # configs/ の生成物が最新かを検査する。src/config/universe.ts や
      # src/analytics/stats.ts を編集して再生成を忘れると、Python 側が
      # 古い定義を読み続ける。実行時エラーにならないので機械的に止める。
      - name: 共有 config のドリフト検査
        run: |
          npm run export:shared
          if ! git diff --quiet -- configs/; then
            echo "::error::configs/ の生成物が古い。'npm run export:shared' を実行して commit すること"
            git diff --stat -- configs/
            exit 1
          fi

  lab:
    name: Research Lab (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 必須依存は numpy と pandas だけ。scikit-learn / LightGBM は任意で、
      # 無ければ該当モデルが NotImplementedError で明示的に止まる
      # (黙って別のモデルにフォールバックしない)。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "lab[dev]"

      # ruff の設定は lab/pyproject.toml にあるので lab/ の中で走らせる
      - name: Ruff
        working-directory: lab
        run: ruff check .

      - name: Test
        working-directory: lab
        run: python -m pytest -q

      # DATA_DICTIONARY.md の特徴量表はコードから生成される。
      # 特徴量を足して再生成を忘れると、定義書と実装がずれる。
      - name: データ辞書の同期検査
        working-directory: lab
        run: python -m qaiz_lab.cli dictionary --check

      # 合成データで研究パイプラインが端から端まで通ることを確認する。
      # ネットワーク不要。CLI が壊れていないことの検査も兼ねる。
      - name: 研究パイプラインのスモークテスト
        working-directory: lab
        run: |
          python -m qaiz_lab.cli doctor
          python -m qaiz_lab.cli run --experiment R001 --quick --codes 40 --days 420

  cross-language:
    name: 言語間パリティ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ダッシュボードと研究ラボが同じ数字を出すことの検証。
    # ここが落ちたら、画面で見ているスコアとバックテストで検証した
    # シグナルが別物になっている。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: npm ci
      - run: python -m pip install -e "lab[dev]"

      - name: TypeScript 側からゴールデンベクタを生成
        run: npm run export:shared

      - name: Python 側が同じ値を出すことを検証
        working-directory: lab
        run: python -m pytest tests/test_parity.py -q
