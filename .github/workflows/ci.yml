name: CI

# 型検査と数理エンジンのテスト。ネットワークにも Cloudflare にも触らないので、
# fork からの PR でも Secret なしで完走する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ が必要。テストは .ts を直接実行しており、
      # ネイティブの型ストリッピングに依存している。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 優位性ベンチマークも CI で回す。README に載せている数字が
      # コード変更で静かにずれるのを防ぐため (実行時間はマシン依存だが、
      # クエリ数と近似比は seed 固定で再現する)。
      - name: Advantage benchmark
        run: npm run bench
