# 任意: GitHub Actions からの自動デプロイ (無料枠内)
# リポジトリの Settings > Secrets に CLOUDFLARE_API_TOKEN を登録すると有効化される。
# 未登録の場合このワークフローはスキップされる (0円運用のまま手動デプロイでOK)。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check secret
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN が未設定のためデプロイをスキップ"
          fi
      - name: Deploy
        if: steps.check.outputs.has_token == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
